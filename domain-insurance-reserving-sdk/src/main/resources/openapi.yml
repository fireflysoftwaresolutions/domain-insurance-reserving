openapi: 3.0.1
info:
  title: Domain Insurance Reserving API
  description: "Orchestrates reserve snapshots through core-insurance-reserving. It\
    \ records snapshot status through the reserving core. It does not build a reporting\
    \ extract, and it does not certify IFRS 17 or Solvency II."
  contact:
    name: Firefly Software Foundation
    email: dev@fireflysoftware.io
  version: 1.0.0
servers:
- url: https://openplatform.fireflysoftware.io/domain-insurance-reserving
  description: Development Environment
- url: /
  description: Local Development Environment
tags:
- name: Reserving
  description: Domain orchestration for reserve snapshots
paths:
  /api/v1/reserve-snapshots/{reserveSnapshotId}/status:
    put:
      tags:
      - Reserving
      summary: Update status
      description: Runs the status saga against core-insurance-reserving.
      operationId: updateStatus
      parameters:
      - name: reserveSnapshotId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveSnapshotDTO"
        "404":
          description: Not found
  /api/v1/reserve-snapshots:
    post:
      tags:
      - Reserving
      summary: Create reserve snapshot
      description: Runs the register saga against core-insurance-reserving.
      operationId: create
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveSnapshotDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveSnapshotDTO"
        "400":
          description: Invalid request
  /api/v1/reserve-snapshots/{reserveSnapshotId}:
    get:
      tags:
      - Reserving
      summary: Get reserve snapshot
      description: Reads one record from core-insurance-reserving.
      operationId: get
      parameters:
      - name: reserveSnapshotId
        in: path
        description: Core identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveSnapshotDTO"
        "404":
          description: Not found
components:
  schemas:
    StatusChangeRequest:
      type: object
      properties:
        status:
          type: string
        statusReason:
          type: string
    ReserveSnapshotDTO:
      required:
      - lineOfBusiness
      - snapshotDate
      - snapshotStatus
      - tenantId
      type: object
      properties:
        reserveSnapshotId:
          type: string
          format: uuid
          nullable: true
        tenantId:
          type: string
          format: uuid
        snapshotDate:
          type: string
          format: date
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        currency:
          type: string
          nullable: true
        snapshotStatus:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - ACCEPTED
        sourceReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
